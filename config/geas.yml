# geas.yml — Configuración de la instancia (MeshHarmes, despliegue en red)
#
# NOTA: las credenciales de MongoDB NO van aquí (repo público).
# Se leen de .env (gitignore). Para cambiar a MongoDB:
#   1. Crear .env con MONGODB_URI=...
#   2. Poner database: mongodb
# De lo contrario, SQLite es el default.

organization: "MeshHarmes"
git_provider: "github"
deployment_profile: "TEAM"
database: "sqlite"  # cambiar a mongodb en .env + config

web_ui: true
mcp_enabled: true
ai_agents: true
departments: false
authentication: "none"
harness: ""

server:
  bind: "192.168.180.142"
  port: 8787
  url: "http://192.168.180.142:8787"
